  <!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Tool</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f5fb;padding:16px}
h1{color:#4f46e5;font-size:22px;text-align:center}
h3{margin:0 0 8px}
.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
input[type=file]{width:100%;font-size:16px;margin:8px 0}
button{width:100%;padding:16px;font-size:18px;border:none;border-radius:12px;background:#4f46e5;color:#fff;margin-top:8px}
#status{text-align:center;color:#444;min-height:24px;margin-top:12px}
</style>
</head>
<body>
<h1>Media Tool</h1>

<div class="card">
  <h3>Image 4K</h3>
  <input type="file" id="imgIn" accept="image/*">
  <button id="imgBtn">4K banao aur download karo</button>
</div>

<div class="card">
  <h3>Video Mute</h3>
  <input type="file" id="vidIn" accept="video/*">
  <button id="vidBtn">Mute karke download karo</button>
</div>

<div id="status"></div>

<script>
const $ = id => document.getElementById(id);

function setStatus(msg){ $('status').textContent = msg; }

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// IMAGE 4K
$('imgBtn').onclick = () => {
  const f = $('imgIn').files[0];
  if(!f){ setStatus('Pehle image select karein'); return; }
  setStatus('Processing...');

  const img = new Image();
  img.onload = () => {
    const scale = Math.min(3840 / img.width, 2160 / img.height);
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * scale);
    c.height = Math.round(img.height * scale);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => {
      download(b, '4k-image.png');
      setStatus('Ho gaya! Download shuru ho gaya');
    }, 'image/png');
  };
  img.onerror = () => setStatus('Image load nahi hui');
  img.src = URL.createObjectURL(f);
};

// VIDEO MUTE
$('vidBtn').onclick = () => {
  const f = $('vidIn').files[0];
  if(!f){ setStatus('Pehle video select karein'); return; }

  const v = document.createElement('video');
  v.src = URL.createObjectURL(f);
  v.muted = true;
  v.playsInline = true;

  v.onloadedmetadata = () => {
    const stream = v.captureStream();
    const ms = new MediaStream(stream.getVideoTracks());
    const chunks = [];
    const rec = new MediaRecorder(ms, { mimeType: 'video/webm' });
    rec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      download(new Blob(chunks, { type: 'video/webm' }), 'muted-video.webm');
      setStatus('Ho gaya! Download shuru ho gaya');
    };
    v.onended = () => rec.stop();
    setStatus('Video chal rahi hai, khatam hone tak wait karein...');
    rec.start();
    v.play();
  };
  v.onerror = () => setStatus('Video load nahi hui');
};
</script>
</body>
</html>
